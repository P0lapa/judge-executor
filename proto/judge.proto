syntax = "proto3";

package judge;

option go_package = "./proto;judge";

enum OutputComparisonMode {
    OUTPUT_COMPARISON_MODE_UNSPECIFIED = 0;
    OUTPUT_COMPARISON_MODE_EXACT = 1;
    OUTPUT_COMPARISON_MODE_TRIMMED_EXACT = 2;
    OUTPUT_COMPARISON_MODE_IGNORE_TRAILING_SPACES = 3;
}

enum TestStatus {
    TEST_STATUS_UNSPECIFIED = 0;
    TEST_STATUS_AC = 1;
    TEST_STATUS_WA = 2;
    TEST_STATUS_RE = 3;
    TEST_STATUS_TLE = 4;
    TEST_STATUS_MLE = 5;
    TEST_STATUS_CE = 6;
    TEST_STATUS_SE = 7;
}

message TestCase {
    string input = 1;
    string expected_output = 2;
}

message ExecuteRequest {
    string submission_id = 1;
    string user_id = 2;
    string task_id = 3;
    string code = 4;
    string lang = 5;
    repeated TestCase test_cases = 6;
    int32 time_limit_ms = 7;
    int32 memory_limit_mb = 8;
    repeated string additional_args = 9;
    OutputComparisonMode comparison_mode = 10;
}

message TestResult {
    bool passed = 1;
    TestStatus status = 2;
    string input = 3;
    string expected_output = 4;
    string actual_output = 5;
    string stderr = 6;
    double time_used_sec = 7;
    int32 memory_used_kb = 8;
    int32 exit_code = 9;
}

message ExecuteResponse {
    repeated TestResult results = 1;
    string error_message = 2;
}

service ExecutorService {
    rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}
